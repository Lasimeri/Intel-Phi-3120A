# clang.cfg: default options for the card's own clang (/opt/phi/bin/clang).
# Loaded automatically because it sits next to the binary; everything the
# host wrapper knc-cc passes, minus the paths, so that a plain "cc hello.c"
# on the card produces knc64-x87 code that the card can run. See clang.md.
--sysroot=/opt/phi
-march=x86-64
-mno-mmx -mno-sse -mno-sse2 -mno-sse3 -mno-ssse3 -mno-sse4.1 -mno-sse4.2 -mno-sse4a
-mno-avx -mno-avx2 -mno-fma -mno-f16c
-mno-movbe -mno-popcnt -mno-lzcnt -mno-bmi -mno-bmi2 -mno-xsave -mno-cx16
-mno-prfchw -mno-clflushopt -mno-rdrnd -mno-rdseed -mno-adx -mno-fsgsbase
-mno-pclmul -mno-aes -mno-sha
-mno-cmov -mno-nopl
-fcf-protection=none
-fno-jump-tables
-static
-rtlib=compiler-rt
-stdlib=libc++
-unwindlib=none
