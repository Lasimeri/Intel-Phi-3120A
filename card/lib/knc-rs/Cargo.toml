[package]
name = "knc"
description = "The Knights Corner vector unit: bit packing and block copy, for card-side Rust"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "knc"
path = "src/lib.rs"

[[bin]]
name = "knc-demo"
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
